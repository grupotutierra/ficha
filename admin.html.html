<style>
/* Layout: panel de trabajo; barra superior con módulo y salida, lista de predios y editor de evaluación con resultado fijo arriba */
:root{
  --bg:#EEF2EC; --card:#FFFFFF; --ink:#1B2A22; --muted:#5B6B61; --line:#CCD6CE;
  --brand:#1F5F3F; --brand-ink:#FFFFFF; --soft:#DCEBDD; --ochre:#B7791F;
  --fav:#D4EDDA; --fav-ink:#1E5A33; --att:#FFF3CD; --att-ink:#7A5200; --des:#F8D7DA; --des-ink:#8A1C1C;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111814; --card:#1A231E; --ink:#E6EEE8; --muted:#9DB0A4; --line:#33433A;
  --brand:#5FB487; --brand-ink:#0D1A12; --soft:#21362A; --ochre:#E0A84A;
  --fav:#1E3A28; --fav-ink:#8FD9A8; --att:#3A3115; --att-ink:#F0C76A; --des:#3E1E1E; --des-ink:#F2A3A3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --card:#1A231E; --ink:#E6EEE8; --muted:#9DB0A4; --line:#33433A;
  --brand:#5FB487; --brand-ink:#0D1A12; --soft:#21362A; --ochre:#E0A84A;
  --fav:#1E3A28; --fav-ink:#8FD9A8; --att:#3A3115; --att-ink:#F0C76A; --des:#3E1E1E; --des-ink:#F2A3A3; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar>div:first-child{min-width:0}
@media (max-width:480px){h1{font-size:19px}}
.mod{display:flex;align-items:center;gap:10px;min-width:0}
.mod svg{width:40px;height:40px;flex:none;--ic-m:var(--brand);--ic-a:var(--ochre)}
.login svg{width:88px;height:88px;--ic-m:var(--brand);--ic-a:var(--ochre)}
.org{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:22px 0 4px}
h3{font-family:var(--display);font-weight:600;font-size:16px;margin:0}
.sub{color:var(--muted);margin:0 0 10px;font-size:14px}
.btn{min-height:44px;border-radius:12px;border:0;font:inherit;font-weight:700;padding-inline:16px;cursor:pointer}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:36px;font-size:14px;padding-inline:12px}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,input:focus,textarea:focus,select:focus{outline:3px solid var(--ochre);outline-offset:1px}
input,textarea,select{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:70px;resize:vertical}
label{font-weight:700;font-size:14px;display:block;margin-bottom:4px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:grid;gap:12px}
.hint{font-size:13px;color:var(--muted)}
.login{max-width:380px;margin:12vh auto 0;display:grid;gap:12px}
.err{color:var(--des-ink);background:var(--des);padding:10px 12px;border-radius:10px;font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{min-height:36px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.row:hover{border-color:var(--brand)}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .m{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--soft);color:var(--brand)}
.pill.fav{background:var(--fav);color:var(--fav-ink)} .pill.att{background:var(--att);color:var(--att-ink)} .pill.des{background:var(--des);color:var(--des-ink)}
.resbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,64px) + 6px);z-index:4;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:10px 14px;margin-top:12px}
.resbar .score{font-family:var(--display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.resbar .dest{font-weight:700}
.crit{display:grid;gap:8px}
.crit .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.notas{display:flex;gap:6px;flex-wrap:wrap}
.nota{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.nota[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.anch{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px;color:var(--muted)}
.anch b{color:var(--ink)}
.sug{font-size:12px;color:var(--ochre);font-weight:700}
.ko{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ko:last-child{border-bottom:0}
.sw{display:flex;gap:4px}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;min-width:560px}
.tbl td{padding:4px}
.tbl input,.tbl select{min-height:40px;font-size:14px}
.razones{margin:6px 0 0 18px;padding:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:9;max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:14px}
a{color:var(--brand)}
.kv{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:4px 10px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="bar">
    <div class="mod"><span id="hIcon" aria-hidden="true"></span><div style="min-width:0"><div class="org" id="hMod">GAIA · Grupo TuTierra</div><h1 id="hTitle">Evaluación de predios</h1></div></div>
    <div style="display:flex;gap:8px"><button class="btn sec sm" id="btnLista" type="button" hidden>Predios</button><button class="btn sec sm" id="btnSalir" type="button" hidden>Salir</button></div>
  </div></header>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>
<script>
/* ===== Núcleo de evaluación (idéntico en Apps Script y en el panel) ===== */
var EVAL_CRITERIOS = [
  { k: 'legal', n: 'Situación legal y titularidad', p: 'peso_legal',
    a5: 'Título inscrito, propietario único, sin cargas', a3: 'Copropiedad en derechos y acciones sin acuerdo, o sucesión con declaratoria', a1: 'Posesión con sustento documental' },
  { k: 'precio', n: 'Precio frente al mercado', p: 'peso_precio',
    a5: 'Hasta 80 % del mercado (oportunidad)', a3: 'Entre 95 % y 110 % (precio de mercado)', a1: 'Entre 110 % y 120 % (muy alto)' },
  { k: 'servicios', n: 'Servicios básicos', p: 'peso_servicios',
    a5: 'Agua, luz y desagüe en el predio', a3: 'Agua y luz a menos de 100 m', a1: 'Sin factibilidad clara de agua ni luz' },
  { k: 'ubicacion', n: 'Ubicación y demanda', p: 'peso_ubicacion',
    a5: 'Alta demanda, cerca de puntos de interés, venta rápida', a3: 'Demanda media, ventas esporádicas', a1: 'Zona aislada, sin ventas comparables' },
  { k: 'acceso', n: 'Acceso y vías', p: 'peso_acceso',
    a5: 'Pista asfaltada', a3: 'Trocha carrozable', a1: 'Solo camino de herradura o servidumbre' },
  { k: 'topografia', n: 'Topografía y clima', p: 'peso_topografia',
    a5: 'Plano, forma regular, sin riesgos', a3: 'Pendiente moderada o viento y heladas fuertes', a1: 'Pendiente fuerte, riesgo de inundación o huaico' },
  { k: 'zonificacion', n: 'Zonificación y restricciones', p: 'peso_zonificacion',
    a5: 'Urbano o zonificado residencial', a3: 'Rústico sin restricciones', a1: 'Restricciones parciales (servidumbre, faja marginal, aeropuerto)' },
  { k: 'disposicion', n: 'Disposición del propietario', p: 'peso_disposicion',
    a5: 'Acepta compromiso condicionado, plazos y entrega documentos', a3: 'Acepta con condiciones o documentos incompletos', a1: 'No acepta compromiso ni estudios' }
];

var EVAL_FILTROS = [
  { k: 'titularidad', n: 'Titularidad', d: 'Sin partida ni documento que acredite la propiedad o la posesión', r: 'Descarte' },
  { k: 'litigio', n: 'Litigio', d: 'Proceso judicial, embargo o medida cautelar vigente', r: 'Descarte hasta que se levante' },
  { k: 'zonas', n: 'Zonas protegidas', d: 'Zona arqueológica, área natural protegida o faja marginal sobre más del 50 % del predio', r: 'Descarte' },
  { k: 'acceso', n: 'Acceso', d: 'Sin vía ni servidumbre de paso posible', r: 'Descarte' },
  { k: 'precio', n: 'Precio', d: 'Precio pedido mayor al 120 % del mercado y el propietario no negocia', r: 'Replanteo o fin' }
];

var EVAL_PARAMS_DEF = [
  ['peso_legal', 20, 'Peso: situación legal y titularidad'],
  ['peso_precio', 15, 'Peso: precio frente al mercado'],
  ['peso_servicios', 15, 'Peso: servicios básicos'],
  ['peso_ubicacion', 15, 'Peso: ubicación y demanda'],
  ['peso_acceso', 10, 'Peso: acceso y vías'],
  ['peso_topografia', 10, 'Peso: topografía y clima'],
  ['peso_zonificacion', 10, 'Peso: zonificación y restricciones'],
  ['peso_disposicion', 5, 'Peso: disposición del propietario'],
  ['min_puntaje', 50, 'Puntaje mínimo para no descartar'],
  ['tt_area', 10000, 'TuTierra: área útil mínima (m²)'],
  ['tt_area_reducida', 7000, 'TuTierra: área útil mínima con puntaje alto (m²)'],
  ['tt_puntaje_alto', 85, 'TuTierra: puntaje que permite el área reducida'],
  ['tt_puntaje', 75, 'TuTierra: puntaje mínimo'],
  ['tt_nota_legal', 4, 'TuTierra: nota mínima de situación legal'],
  ['tt_nota_zonificacion', 3, 'TuTierra: nota mínima de zonificación'],
  ['ml_area_min', 2500, 'Mi Lote: área total mínima (m²)'],
  ['ml_puntaje', 60, 'Mi Lote: puntaje mínimo'],
  ['ml_perdida', 0.30, 'Mi Lote: fracción del área que se pierde en vías y aportes'],
  ['ml_lote_min', 200, 'Mi Lote: área mínima de lote (m²)'],
  ['rv_ratio', 0.80, 'Reventa: precio máximo como fracción del mercado'],
  ['rv_puntaje', 60, 'Reventa: puntaje mínimo']
];

function evalParamsDefault() {
  var o = {};
  EVAL_PARAMS_DEF.forEach(function (r) { o[r[0]] = r[1]; });
  return o;
}

/** Nota sugerida de precio a partir de la relación pedido / mercado. */
function evalNotaPrecio(ratio) {
  if (!(ratio > 0)) return 0;
  if (ratio <= 0.80) return 5;
  if (ratio <= 0.95) return 4;
  if (ratio <= 1.10) return 3;
  if (ratio <= 1.15) return 2;
  return 1;
}

function evalValoracion(nota) {
  if (nota >= 4) return 'Favorable';
  if (nota === 3) return 'Requiere atención';
  if (nota >= 1) return 'Desfavorable';
  return '';
}

function evalNum(x) { var n = parseFloat(String(x === undefined || x === null ? '' : x).replace(/,/g, '')); return isNaN(n) ? 0 : n; }

/** Calcula puntaje y destino recomendado. ev: datos de la evaluación; P: parámetros. */
function evalRecomendar(ev, P) {
  P = P || evalParamsDefault();
  ev = ev || {};
  var crit = ev.crit || {}, notas = {}, puntaje = 0, faltan = [];
  EVAL_CRITERIOS.forEach(function (c) {

    if (!nota) faltan.push(c.n);

  puntaje = Math.round(puntaje * 10) / 10;

  var pm = evalNum(ev.precio_mercado_m2), pp = evalNum(ev.precio_pedido_m2);
  var ratio = pm > 0 && pp > 0 ? pp / pm : 0;
  var ko = EVAL_FILTROS.filter(function (f) { return ev.ko && ev.ko[f.k] && ev.ko[f.k].si; });
  var r = { puntaje: puntaje, notas: notas, area_util: areaUtil, ratio: ratio, faltan: faltan, razones: [], destino: '' };
  var fmt = function (n) { return Math.round(n).toLocaleString('es-PE'); };

  if (ko.length) {
    r.destino = 'Descarte';
    ko.forEach(function (f) { r.razones.push('Filtro excluyente: ' + f.n.toLowerCase() + ' (' + f.d.toLowerCase() + ').'); });
    return r;
  }
  if (puntaje < P.min_puntaje) {
    r.destino = 'Descarte';
    r.razones.push('El puntaje (' + puntaje + ') es menor al mínimo de ' + P.min_puntaje + '.');
    return r;
  }
  if (ev.solo_corretaje) {
    r.destino = 'Corretaje';
    r.razones.push('El propietario solo busca que se le vendan los lotes.');

  var ttArea = areaUtil >= P.tt_area || (areaUtil >= P.tt_area_reducida && puntaje >= P.tt_puntaje_alto);

  if (!ttArea) tt.push('área útil de ' + fmt(areaUtil) + ' m² (pide ' + fmt(P.tt_area) + ' m², o ' + fmt(P.tt_area_reducida) + ' m² con puntaje de ' + P.tt_puntaje_alto + ')');
  if (puntaje < P.tt_puntaje) tt.push('puntaje de ' + puntaje + ' (pide ' + P.tt_puntaje + ')');
  if (notas.legal < P.tt_nota_legal) tt.push('situación legal con nota ' + notas.legal + ' (pide ' + P.tt_nota_legal + ')');

  if (!tt.length) {
    r.destino = 'TuTierra';
    r.razones.push('Cumple área útil, puntaje (' + puntaje + '), situación legal y zonificación para un proyecto TuTierra.');

  }
  r.razones.push('No califica para TuTierra por: ' + tt.join('; ') + '.');
  // Mi Lote
  var lotesPosibles = Math.floor(areaUtil * (1 - P.ml_perdida) / P.ml_lote_min);
  var ml = [];
  if (areaTotal < P.ml_area_min) ml.push('área total de ' + fmt(areaTotal) + ' m² (pide ' + fmt(P.ml_area_min) + ' m²)');
  if (puntaje < P.ml_puntaje) ml.push('puntaje de ' + puntaje + ' (pide ' + P.ml_puntaje + ')');

  if (!ml.length) {
    r.destino = 'Mi Lote';
    r.razones.push('Cumple para Mi Lote: ' + fmt(areaTotal) + ' m² de área total y puntaje de ' + puntaje + '; da para unos ' + lotesPosibles + ' lotes de ' + P.ml_lote_min + ' m².');
    return r;
  }
  r.razones.push('No califica para Mi Lote por: ' + ml.join('; ') + '.');
  // Reventa
  if (ratio > 0 && ratio <= P.rv_ratio && puntaje >= P.rv_puntaje) {
    r.destino = 'Reventa';
    r.razones.push('El precio pedido es el ' + Math.round(ratio * 100) + ' % del mercado (oportunidad) y el puntaje es ' + puntaje + '.');
    return r;
  }
  r.destino = 'Corretaje';
  r.razones.push('Puntaje de ' + puntaje + ', suficiente para corretaje.');
  return r;
}

async function api(op,extra={}){
  let res;
  try{ res=await fetch(API,{method:"POST",credentials:"omit",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({accion:"admin",op,clave:CLAVE,...extra})}); }
  catch(e){ throw new Error("Sin conexión. Revisa tu internet e inténtalo otra vez."); }
  let j; try{ j=await res.json(); }catch(e){ throw new Error("El servidor no respondió bien. Inténtalo en un momento."); }
  if(!j.ok) throw new Error(j.error||"No se pudo completar.");
  return j.data;
}

/* ---------- Lista de predios ---------- */
function estadoDe(f){
  if(f.eval&&f.eval.estado==="Aprobada") return "Aprobadas";
  if(f.eval&&f.eval.estado==="Emitida") return f.eval.destino==="Descarte"?"Descartadas":"Evaluadas";
  if(f.eval&&f.eval.estado==="Borrador") return "En evaluación";
  return "Sin evaluar";
}
function pillFor(f){
  const e=estadoDe(f), d=f.eval&&f.eval.destino;
  const cls={"Aprobadas":"fav","Evaluadas":"att","Descartadas":"des","En evaluación":"","Sin evaluar":""}[e];
  const txt=e==="Aprobadas"?"Proyecto · "+d:e==="Evaluadas"?"Evaluada · "+d:e==="Descartadas"?"Descartada":e==="En evaluación"?"Borrador":"Sin evaluar";
  return `<span class="pill ${cls}">${esc(txt)}</span>`;
}

/* ---------- Editor de evaluación ---------- */
function sugerencias(v){
  const s={};
  const tit=v.titularidad||"";
  if(tit==="Título inscrito") s.legal=v.pr_unico==="Sí"?5:3; else if(tit==="Sucesión") s.legal=3; else if(tit==="Compraventa sin inscribir") s.legal=2; else if(tit==="Posesión") s.legal=1;
  const ac=v.acceso||[];
  if(ac.includes("Pista")) s.acceso=5; else if(ac.includes("Trocha carrozable")) s.acceso=3; else if(ac.includes("Camino de herradura")) s.acceso=1;
  const sv=v.servicios||[];
  if(sv.includes("Agua")&&sv.includes("Luz")&&sv.includes("Desagüe")) s.servicios=4; else if(sv.includes("Agua")&&sv.includes("Luz")) s.servicios=3; else if(sv.includes("Agua")||sv.includes("Luz")) s.servicios=2; else if(sv.includes("Ninguno")) s.servicios=1;
  if(v.compromiso==="Sí") s.disposicion=4; else if(v.compromiso==="Por consultar") s.disposicion=3; else if(v.compromiso==="No") s.disposicion=1;
  return s;
}
function nuevaEval(d){
  const v=d.v||{}, crit={}, sug=sugerencias(v);
  EVAL_CRITERIOS.forEach(c=>crit[c.k]={nota:sug[c.k]||0,sit:"",sugerida:!!sug[c.k]});
  return {area_total:d.area_m2||"",afectaciones:"",afectaciones_det:"",precio_pedido_m2:v.precio_m2||"",precio_mercado_m2:"",moneda:"S/",
    partida:v.partida||"",solo_corretaje:/corretaje/i.test(v.busca||""),ko:{},crit,hallazgos:[{asiento:"",acto:"",detalle:"",obs:""}],
    recomendaciones:[""],docs:[{doc:"",fuente:"",prioridad:"Indispensable"}],opinion:"",destino_final:"",motivo_cambio:""};
}

  <h2>Criterios</h2>
  <p class="sub">Califica de 1 a 5. Las notas marcadas como sugeridas salen de la ficha: confírmalas o cámbialas.</p>
  <div class="stack">${EVAL_CRITERIOS.map(c=>{const x=EV.crit[c.k]||{};const peso=P[c.p];const pts=x.nota?Math.round(x.nota/5*peso*10)/10:0;
    const sug=c.k==="precio"&&r.ratio?evalNotaPrecio(r.ratio):0;
    return `<div class="card crit"><div class="head"><h3>${esc(c.n)}</h3><span class="hint">${pts} / ${peso} pts</span></div>
      <div class="notas" role="group" aria-label="Nota ${esc(c.n)}">${[1,2,3,4,5].map(n=>`<button type="button" class="nota" data-c="${c.k}" data-n="${n}" aria-pressed="${x.nota===n}" ${dis}>${n}</button>`).join("")}
        ${x.sugerida&&x.nota?`<span class="sug">Sugerida desde la ficha</span>`:""}${sug&&sug!==x.nota?`<span class="sug">Por precio corresponde ${sug}</span>`:""}</div>
      <div class="anch"><b>5</b><span>${esc(c.a5)}</span><b>3</b><span>${esc(c.a3)}</span><b>1</b><span>${esc(c.a1)}</span></div>
      <input data-sit="${c.k}" placeholder="Situación encontrada (sale en el informe)" value="${esc(x.sit||"")}" ${dis}></div>`;}).join("")}</div>

  <h2>Hallazgos registrales</h2>
  <div class="card tbl"><table><tbody>${EV.hallazgos.map((h,i)=>`<tr>
    <td style="width:12%"><input data-h="${i}" data-hk="asiento" placeholder="Asiento" value="${esc(h.asiento)}" ${dis}></td>
    <td style="width:24%"><input data-h="${i}" data-hk="acto" placeholder="Acto" value="${esc(h.acto)}" ${dis}></td>
    <td><input data-h="${i}" data-hk="detalle" placeholder="Detalle" value="${esc(h.detalle)}" ${dis}></td>
    <td style="width:24%"><input data-h="${i}" data-hk="obs" placeholder="Observación" value="${esc(h.obs)}" ${dis}></td>
    <td style="width:40px"><button type="button" class="btn sec sm" data-del="hallazgos" data-i="${i}" aria-label="Quitar fila" ${dis}>×</button></td></tr>`).join("")}</tbody></table>
    <button type="button" class="btn sec sm" data-add="hallazgos" ${dis}>Agregar hallazgo</button></div>

  <h2>Documentación faltante</h2>
  <div class="card tbl"><table><tbody>${EV.docs.map((x,i)=>`<tr>
    <td><input data-d="${i}" data-dk="doc" placeholder="Documento" value="${esc(x.doc)}" ${dis}></td>
    <td style="width:28%"><input data-d="${i}" data-dk="fuente" placeholder="Fuente" value="${esc(x.fuente)}" ${dis}></td>
    <td style="width:20%"><select data-d="${i}" data-dk="prioridad" aria-label="Prioridad" ${dis}>${PRIORIDADES.map(p=>`<option ${x.prioridad===p?"selected":""}>${p}</option>`).join("")}</select></td>
    <td style="width:40px"><button type="button" class="btn sec sm" data-del="docs" data-i="${i}" aria-label="Quitar fila" ${dis}>×</button></td></tr>`).join("")}</tbody></table>
    <button type="button" class="btn sec sm" data-add="docs" ${dis}>Agregar documento</button></div>

  <h2>Recomendaciones</h2>
  <div class="card stack">${EV.recomendaciones.map((x,i)=>`<div style="display:flex;gap:8px"><input data-r="${i}" placeholder="Recomendación ${i+1}" value="${esc(x)}" ${dis}><button type="button" class="btn sec sm" data-del="recomendaciones" data-i="${i}" aria-label="Quitar" ${dis}>×</button></div>`).join("")}
    <div><button type="button" class="btn sec sm" data-add="recomendaciones" ${dis}>Agregar recomendación</button></div></div>

  <h2>Conclusión y destino</h2>
  <div class="card stack" id="concl">${conclHTML(r)}</div>
  <div class="card stack" style="margin-top:12px">
    <div><label for="e_opinion">Opinión del evaluador</label><textarea id="e_opinion" data-e="opinion" ${dis}>${esc(EV.opinion)}</textarea></div>
  </div>

  <div class="actions">
    <button type="button" class="btn sec" id="bGuardar" ${dis}>Guardar borrador</button>
    <button type="button" class="btn pri" id="bEmitir" ${dis}>Emitir informe en PDF</button>
    <button type="button" class="btn sec" id="bAprobar" ${(d.evalEstado==="Emitida"&&(EV.destino_final||r.destino)!=="Descarte")?"":"disabled"}>Aprobar como proyecto</button>
  </div>
  <p class="hint" id="estadoTxt">${esc(estadoTexto())}</p>
  <div id="pdfBox"></div>`;
}
function estadoTexto(){
  const e=CUR.evalEstado;
  if(e==="Aprobada") return "Estado: aprobada como proyecto.";
  if(e==="Emitida") return "Estado: informe emitido. Si cambias algo, vuelve a emitirlo.";
  if(e==="Borrador") return "Estado: borrador guardado.";
  return "Estado: sin guardar.";
}
function conclHTML(r){
  const dis=bloqueada()?"disabled":"", fin=EV.destino_final||r.destino;
  const ko=EVAL_FILTROS.some(f=>EV.ko&&EV.ko[f.k]&&EV.ko[f.k].si);
  if(r.faltan.length&&!ko) return `<p class="hint" style="margin:0">El destino se calcula cuando califiques todos los criterios. Faltan: ${esc(r.faltan.join(", "))}.</p>`;
  return `<div><b>Destino recomendado: ${esc(r.destino)}</b><ul class="razones">${r.razones.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div><label for="e_destino">Destino final</label><select id="e_destino" data-e="destino_final" ${dis}>
      <option value="">Igual al recomendado (${esc(r.destino)})</option>${DESTINOS.map(x=>`<option ${EV.destino_final===x?"selected":""}>${x}</option>`).join("")}</select></div>
    ${fin!==r.destino?`<div><label for="e_motivo">Motivo del cambio de destino</label><textarea id="e_motivo" data-e="motivo_cambio" ${dis}>${esc(EV.motivo_cambio)}</textarea></div>`:""}`;
}
function refrescar(){
  const r=resultado();
  $("resbar").innerHTML=resbarHTML(r);
  const au=$("areaUtil"); if(au) au.textContent=num(r.area_util)+" m²";
  const rh=$("ratioHint"); if(rh) rh.textContent=r.ratio?"Pedido = "+Math.round(r.ratio*100)+" % del mercado":"";
  const c=$("concl"); if(c && !c.contains(document.activeElement)) c.innerHTML=conclHTML(r);
}
function rerender(){ const y=scrollY; renderEval(); scrollTo(0,y); }
function payload(){ const e=JSON.parse(JSON.stringify(EV)); e.hallazgos=e.hallazgos.filter(h=>h.asiento||h.acto||h.detalle||h.obs); e.docs=e.docs.filter(x=>x.doc); e.recomendaciones=e.recomendaciones.filter(x=>String(x).trim()); return e; }
async function accion(op,btn){
  if(busy) return; busy=true; const t=btn.textContent; btn.disabled=true; btn.textContent=op==="emitir"?"Generando PDF…":op==="aprobar"?"Aprobando…":"Guardando…";
  try{
    const r=await api(op,{codigo:CUR.codigo,eval:op==="aprobar"?undefined:payload()});
    CUR.evalEstado=r.estado; if(r.pdfUrl) CUR.evalPdf=r.pdfUrl;
    const f=FICHAS.find(x=>x.codigo===CUR.codigo); if(f) f.eval={estado:r.estado,puntaje:r.puntaje??(f.eval&&f.eval.puntaje),destino:r.destino_final||r.destino,pdf:r.pdfUrl||(f.eval&&f.eval.pdf)};
    rerender();
    if(op==="emitir"){ $("pdfBox").innerHTML=`<div class="card" style="margin-top:10px"><b>Informe emitido.</b> Se guardó en la carpeta del predio, subcarpeta 02_Evaluación.
      <div class="actions" style="margin-top:8px"><button type="button" class="btn pri sm" id="bDescargar">Descargar PDF</button><a class="btn sec sm" style="display:inline-flex;align-items:center;text-decoration:none" href="${esc(r.pdfUrl)}" target="_blank" rel="noopener">Abrir en Drive</a></div></div>`;
      $("bDescargar").onclick=()=>descargar(r.pdfBase64,r.pdfName); }
    toast(op==="emitir"?"Informe emitido.":op==="aprobar"?"Aprobado como proyecto. Ya puede pasar a comercialización.":"Borrador guardado.");
  }catch(e){ toast(e.message); btn.disabled=false; btn.textContent=t; }
  busy=false;
}
function descargar(b64,name){
  try{ const bin=atob(b64),u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u8],{type:"application/pdf"})); const a=document.createElement("a"); a.href=url;
    a.download=String(name||"evaluacion.pdf").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w.\- ]+/g,"").trim();
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){ toast("No se pudo descargar. Ábrelo desde Drive."); }
}

/* ---------- Eventos ---------- */
document.addEventListener("submit",e=>{ if(e.target.id==="fLogin"){ e.preventDefault(); login($("iClave").value); } });
document.addEventListener("input",e=>{
  const t=e.target; if(!EV) { if(t.id==="iBuscar"){ buscar=t.value; const pos=t.selectionStart; renderLista(); const n=$("iBuscar"); n.focus(); n.setSelectionRange(pos,pos);} return; }
  if(t.dataset.e){ let val=t.value; if(t.dataset.e==="solo_corretaje") val=val==="si"; EV[t.dataset.e]=val;
    if(t.dataset.e==="precio_pedido_m2"||t.dataset.e==="precio_mercado_m2"){ const r=resultado(); const s=r.ratio?evalNotaPrecio(r.ratio):0; const c=EV.crit.precio; if(s&&(!c.nota||c.auto)){ c.nota=s; c.auto=true; rerender(); const el=$(t.id); if(el){el.focus(); const L=el.value.length; el.setSelectionRange(L,L);} return; } }
    if(t.dataset.e==="destino_final"){ refrescar(); const c=$("concl"); if(c) c.innerHTML=conclHTML(resultado()); return; }
    refrescar(); return; }
  if(t.dataset.sit){ EV.crit[t.dataset.sit].sit=t.value; return; }
  if(t.dataset.koNota){ EV.ko[t.dataset.koNota].nota=t.value; return; }
  if(t.dataset.h!==undefined){ EV.hallazgos[+t.dataset.h][t.dataset.hk]=t.value; return; }
  if(t.dataset.d!==undefined){ EV.docs[+t.dataset.d][t.dataset.dk]=t.value; return; }
  if(t.dataset.r!==undefined){ EV.recomendaciones[+t.dataset.r]=t.value; return; }
});
document.addEventListener("change",e=>{ const t=e.target; if(EV&&(t.tagName==="SELECT")){ t.dispatchEvent(new Event("input",{bubbles:true})); } });
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t||t.disabled) return;
  if(t.dataset.f){ filtro=t.dataset.f; renderLista(); return; }
  if(t.dataset.open){ abrir(t.dataset.open); return; }
  if(t.dataset.c){ const c=EV.crit[t.dataset.c]; c.nota=+t.dataset.n; c.sugerida=false; c.auto=false; rerender(); return; }
  if(t.dataset.ko){ EV.ko=EV.ko||{}; EV.ko[t.dataset.ko]={...(EV.ko[t.dataset.ko]||{}),si:t.dataset.v==="1"}; rerender(); return; }
  if(t.dataset.add){ const k=t.dataset.add; EV[k].push(k==="hallazgos"?{asiento:"",acto:"",detalle:"",obs:""}:k==="docs"?{doc:"",fuente:"",prioridad:"Necesario"}:""); rerender(); return; }
  if(t.dataset.del){ const k=t.dataset.del; EV[k].splice(+t.dataset.i,1); if(!EV[k].length) EV[k].push(k==="hallazgos"?{asiento:"",acto:"",detalle:"",obs:""}:k==="docs"?{doc:"",fuente:"",prioridad:"Necesario"}:""); rerender(); return; }
  if(t.id==="bGuardar") return accion("guardar",t);
  if(t.id==="bEmitir") return accion("emitir",t);
  if(t.id==="bAprobar") return accion("aprobar",t);
});
$("btnLista").onclick=async()=>{ renderLista(); scrollTo(0,0); try{ const d=await api("init"); FICHAS=d.fichas; P={...evalParamsDefault(),...d.params}; if(!EV) renderLista(); }catch(e){} };
$("btnSalir").onclick=()=>{ CLAVE=""; store("tt_clave",null); FICHAS=[]; EV=null; CUR=null; renderLogin(); };

function medir(){ const h=document.querySelector('header.top'); if(h) document.documentElement.style.setProperty('--hh',h.offsetHeight+'px'); }
addEventListener('resize',medir); new ResizeObserver(medir).observe(document.querySelector('header.top'));
const saved=load("tt_clave");
if(saved){ $("main").innerHTML='<div class="empty" style="margin-top:20px">Entrando…</div>'; login(saved); } else renderLogin();
</script>
</body>
</html>
